<!-- família: split · papel: contexto (2ª capa), tensão ou virada em 2 tempos · densidade: média
     slots: .split-campo (fundo-tom-200/100/800, a ideia 1: âncora t-titulo ancorada embaixo do campo) ·
     .split-resto (a ideia 2: t-lead + um detalhe com função: régua, chips, fio)
     variações: horizontal 58/42 (padrão) · .vertical (campo à esquerda em 3 colunas) · campo escuro (tom-800/900)
     a costura entre campo e fundo é o "corte" entre as duas ideias: não ponha texto atravessando -->
<section class="slide fundo-tom-50" data-layout="split">
  <div class="split-campo fundo-tom-200">
    <p class="t-rotulo">Quem escreve</p>
    <h2 class="t-titulo">Sou hipnoterapeuta. Atendo pacientes até hoje.</h2>
  </div>
  <div class="split-resto">
    <p class="t-lead">E por muito tempo meu consultório viveu espalhado em 5 apps.</p>
    <div class="regua" style="--n:5">
      <span><span class="icone">{{icone:calendar}}</span><span class="t-nota">Agenda</span></span>
      <span><span class="icone">{{icone:message-circle}}</span><span class="t-nota">WhatsApp</span></span>
      <span><span class="icone">{{icone:video}}</span><span class="t-nota">Meet</span></span>
      <span><span class="icone">{{icone:notebook-pen}}</span><span class="t-nota">Caderno</span></span>
      <span><span class="icone">{{icone:globe}}</span><span class="t-nota">Site</span></span>
    </div>
  </div>
  <footer class="rodape"><span class="marca">{{logo}}</span><span class="pag"><b>{{n}}</b>/{{t}}</span></footer>
</section>
