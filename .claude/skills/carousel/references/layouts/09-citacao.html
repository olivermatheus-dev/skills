<!-- família: citacao · papel: síntese, regra, voz do fundador · densidade: leve
     slots: eyebrow (o contexto da frase) · .aspas (ornamento na serifa de destaque, cor --s-orn) ·
     .cit-bloco (p.citacao-texto ≤ 14 palavras em --font-accent romano + .cit-autor: hairline curta + quem disse)
     conta como uso da serifa de destaque: nenhuma ênfase serifa a menos de 2 slides.
     autor real e verificável (ou o fundador); nunca citação inventada nem fala de paciente.
     variações: fundo escuro tom-900 (padrão) · creme com aspas em tom-200 -->
<section class="slide fundo-tom-900" data-layout="citacao">
  <p class="eyebrow">Uma regra desde o começo</p>
  <span class="aspas" aria-hidden="true">“</span>
  <div class="cit-bloco">
    <p class="citacao-texto">Se uma feature complica, não entra.</p>
    <div class="cit-autor">
      <hr class="hairline curta">
      <p class="t-nota" style="color:var(--s-fg2)">Fundador da kz, hipnoterapeuta</p>
    </div>
  </div>
  <footer class="rodape"><span class="marca">{{logo}}</span><span class="pag"><b>{{n}}</b>/{{t}}</span></footer>
</section>
