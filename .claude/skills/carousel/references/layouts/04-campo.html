<!-- família: campo · papel: tensão, virada ou respiro · densidade: leve
     slots: .campo-alto (a primeira metade da frase, t-sub em --s-fg2) · .campo-baixo (o golpe, t-titulo/t-display em --s-fg)
     o meio vazio é o assunto (o cansaço, a pausa): não preencha. Fundo sólido da escala: tom-800/900 (escuro) ou tom-200/300.
     variações: frase única ancorada embaixo · frase única no alto · .campo-fio (hairline curta no meio, marca a pausa) -->
<section class="slide fundo-tom-900" data-layout="campo">
  <p class="campo-alto t-sub" style="font-weight:500">No fim do dia, eu não estava cansado de atender.</p>
  <h2 class="campo-baixo t-display">Estava cansado de <span class="enf-cor">gerenciar.</span></h2>
  <footer class="rodape"><span class="marca">{{logo}}</span><span class="pag"><b>{{n}}</b>/{{t}}</span></footer>
</section>
