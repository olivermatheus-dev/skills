<!-- família: numero · papel: prova (dado com fonte), decisão, passo · densidade: leve
     slots: .num-titulo (t-sub: a frase que o número prova) · .num-bloco (t-giga 1–3 algarismos + .num-legenda t-sub "o que é") ·
     .num-ficha (hairline + 2 fatos curtos com t-rotulo em cima: ficha técnica)
     número só do contexto (BUSINESS/COPY/PRODUTO) e com fonte; nada de número redondo inventado.
     variações: numeral em --font-accent romano (class "serifa") quando não há outra serifa a menos de 2 slides -->
<section class="slide fundo-branco" data-layout="numero">
  <h2 class="num-titulo t-sub">Então decidi construir esse lugar.</h2>
  <div class="num-bloco">
    <span class="t-giga">2</span>
    <p class="num-legenda t-sub">anos de<br>desenvolvimento</p>
  </div>
  <div class="num-ficha">
    <hr class="hairline">
    <div><p class="t-rotulo">O quê</p><p class="t-corpo" style="font-size:36px">Um sistema só, com a sessão no centro.</p></div>
    <div><p class="t-rotulo">Com quem</p><p class="t-corpo" style="font-size:36px">Uma terapeuta no time testando cada decisão.</p></div>
  </div>
  <footer class="rodape"><span class="marca">{{logo}}</span><span class="pag"><b>{{n}}</b>/{{t}}</span></footer>
</section>
