<!-- família: trilho · papel: prova, contexto, passo a passo, síntese · densidade: média
     slots: .trilho-topo (eyebrow opcional + t-titulo) · ul.trilho-lista com 3–5 li (nó com ícone ou número real + frase ≤ 5 palavras)
     o trilho vertical liga os nós: use quando os itens são da mesma família (mesma dor, passos de um processo).
     número no nó só se houver sequência real (passo 1, 2, 3); senão, ícone Lucide.
     variações: 3 itens (padrão, 168 px por linha) · 5 itens (linha 144 px, frase 44 px) -->
<section class="slide fundo-creme" data-layout="trilho">
  <div class="trilho-topo">
    <p class="eyebrow">Perguntei a colegas terapeutas</p>
    <h2 class="t-titulo">Ouvi a mesma dor, de novo e de novo.</h2>
  </div>
  <ul class="trilho-lista">
    <li><span class="no"><span class="icone">{{icone:calendar}}</span></span><p>Organizar a rotina.</p></li>
    <li><span class="no"><span class="icone">{{icone:bell}}</span></span><p>Lembrar dos agendamentos.</p></li>
    <li><span class="no"><span class="icone">{{icone:file-text}}</span></span><p>Documentar as sessões.</p></li>
  </ul>
  <footer class="rodape"><span class="marca">{{logo}}</span><span class="pag"><b>{{n}}</b>/{{t}}</span></footer>
</section>
