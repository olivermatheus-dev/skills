<!-- família: cta · papel: CTA (sempre o último) · densidade: leve
     slots: .cta-texto (t-titulo: o pedido, ≤ 12 palavras) · .cta-resposta (t-rotulo com a ação + o "objeto da resposta":
     régua de opções para comentar número, ou 1 botão .ui-btn para link na bio, ou o gesto de salvar)
     UM pedido só (comentar OU salvar OU enviar OU link). Rodapé sem seta. A marca já está no rodapé: sem logo extra.
     variações: fundo tom-800 (padrão) · tom-200 · creme com régua em cards -->
<section class="slide fundo-tom-800" data-layout="cta">
  <h2 class="cta-texto t-display">E você: <span class="enf-cor">quantos</span> apps abre pra fazer uma sessão?</h2>
  <div class="cta-resposta">
    <p class="t-rotulo">Comenta o número</p>
    <div class="opcoes"><span>1</span><span>2</span><span>3</span><span>4</span><span>5+</span></div>
  </div>
  <footer class="rodape"><span class="marca">{{logo}}</span><span class="pag"><b>{{n}}</b>/{{t}}</span></footer>
</section>
