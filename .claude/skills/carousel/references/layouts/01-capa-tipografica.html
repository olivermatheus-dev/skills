<!-- família: capa-tipografica · papel: gancho · densidade: leve
     slots: eyebrow (opcional, ≤ 4 palavras) · .capa-motivo (o motivo do carrossel entrando pelo alto e sangrando
     120–240 px à direita = pista de deslize) · h1.t-display (≤ 10 palavras, 3–4 linhas) · .t-lead (apoio ≤ 10 palavras)
     variações: sem motivo (só tipo, título sobe para o meio-baixo) · fundo tom-100 · ênfase serifa na palavra da virada
     tokens: {{icone:nome}} = node tools/icon.mjs nome --brand <slug> · {{logo}} = logo da marca com fill currentColor
     rodapé da capa: sem marca, só "arraste" -->
<section class="slide fundo-creme" data-layout="capa-tipografica">
  <p class="eyebrow">Carta do fundador</p>
  <div class="capa-motivo" data-sangra>
    <div class="card janela-mini" style="left:560px; top:176px; z-index:1"><span class="icone">{{icone:calendar}}</span><span>Agenda</span></div>
    <div class="card janela-mini" style="left:632px; top:236px; z-index:2"><span class="icone">{{icone:message-circle}}</span><span>WhatsApp</span></div>
    <div class="card janela-mini" style="left:704px; top:296px; z-index:3"><span class="icone">{{icone:video}}</span><span>Meet</span></div>
    <div class="card janela-mini" style="left:776px; top:356px; z-index:4"><span class="icone">{{icone:notebook-pen}}</span><span>Caderno</span></div>
    <div class="card janela-mini alto" style="left:848px; top:416px; z-index:5"><span class="icone">{{icone:globe}}</span><span>Site</span></div>
  </div>
  <div class="capa-texto">
    <h1 class="t-display">Eu também queria só <span class="enf-serifa">atender.</span></h1>
    <p class="t-lead">Por que um terapeuta construiu a kz</p>
  </div>
  <footer class="rodape"><span></span><span class="arraste">arraste {{icone:arrow-right}}</span></footer>
</section>
