<!-- fmt-meme: colar dentro da tag style do template do carousel. Só tokens da marca; recria a ESTRUTURA do meme, nunca a imagem original. -->
<style>
/* escolha / expectativa: 2 cards (vertical com .mm-stack) */
.mm-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.mm-duo.mm-stack { grid-template-columns: 1fr; }
.mm-card { background: var(--surface); border: var(--border-width, 1px) solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-md); padding: 48px 40px; font: 600 48px/1.2 var(--font-heading); }
.mm-label { font-size: 32px; font-weight: 600; color: var(--accent); }

/* print de conversa */
.mm-chat { display: flex; flex-direction: column; gap: 20px; }
.mm-msg { max-width: 78%; padding: 24px 32px; border-radius: var(--radius); font-size: 38px; line-height: 1.3;
  background: var(--surface); box-shadow: var(--shadow-sm); }
.mm-msg.eu { align-self: flex-end; background: var(--accent-soft, var(--surface-2)); }
.mm-msg small { display: block; font-size: 26px; opacity: .7; margin-top: 8px; }

/* tier list */
.mm-tier { display: flex; flex-direction: column; gap: 12px; }
.mm-row { display: grid; grid-template-columns: 120px 1fr; min-height: 132px; border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.mm-row b { display: grid; place-items: center; font: 700 56px var(--font-heading); background: var(--surface-2); }
.mm-row span { display: flex; align-items: center; padding: 0 32px; font-size: 38px; }
</style>

<!-- tier (kz: trocar fundos das letras por pastéis da marca via var(--pastel-*) se existirem) -->
<section class="slide">
  <h2>Onde eu guardo as notas de sessão</h2>
  <div class="mm-tier">
    <div class="mm-row"><b>S</b><span></span></div>
    <div class="mm-row"><b>A</b><span>caderno de capa dura</span></div>
    <div class="mm-row"><b>B</b><span>Notion que eu nunca abro</span></div>
    <div class="mm-row"><b>C</b><span>áudio pra mim mesma no WhatsApp</span></div>
    <div class="mm-row"><b>D</b><span>"eu lembro"</span></div>
  </div>
  <div class="footer"><span>@handle</span><span></span></div>
</section>

<!-- print de conversa (nomes fictícios) -->
<section class="slide">
  <div class="mm-chat">
    <div class="mm-msg">Oi! Qual é o link de hoje?<small>Paciente (ilustrativo) · 18:58</small></div>
    <div class="mm-msg eu">Mandei semana passada 🙏<small>18:59</small></div>
    <div class="mm-msg">Achei 3 links diferentes kkk<small>19:00</small></div>
  </div>
  <div class="footer"><span>@handle</span><span></span></div>
</section>
