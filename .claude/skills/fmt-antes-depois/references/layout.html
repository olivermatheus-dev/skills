<!-- fmt-antes-depois: colar dentro da tag style do template do carousel. Só tokens da marca. -->
<style>
/* split: post único dividido */
.ad-split { padding: 0; gap: 0; }
.ad-half { flex: 1; padding: 64px var(--pad); display: flex; flex-direction: column; justify-content: center; gap: 24px; position: relative; }
.ad-half.antes { background: var(--surface-2); }
.ad-half.depois { background: var(--bg); padding-bottom: 140px; }
.ad-label { font: 700 32px var(--font-heading); color: var(--accent); }

/* caos: cards espalhados, legíveis */
.ad-pile { position: relative; height: 300px; }
.ad-chip { position: absolute; background: var(--surface); border: var(--border-width, 1px) solid var(--border);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-md); padding: 20px 28px; font: 600 34px var(--font-body); }
.ad-chip:nth-child(1) { left: 0;    top: 10px;  transform: rotate(-3deg); }
.ad-chip:nth-child(2) { left: 300px; top: 0;    transform: rotate(2deg); }
.ad-chip:nth-child(3) { left: 600px; top: 40px; transform: rotate(-2deg); }
.ad-chip:nth-child(4) { left: 120px; top: 150px; transform: rotate(3deg); }
.ad-chip:nth-child(5) { left: 480px; top: 170px; transform: rotate(-1deg); }

/* calma: 1 card alinhado (tela do produto ou resumo) */
.ad-one { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 40px; font-size: 38px; }
.ad-one img { width: 100%; display: block; border-radius: var(--radius-sm); }
</style>

<section class="slide ad-split">
  <div class="ad-half antes">
    <span class="ad-label">Antes</span>
    <div class="ad-pile">
      <span class="ad-chip">Google Agenda</span><span class="ad-chip">WhatsApp</span><span class="ad-chip">Meet</span>
      <span class="ad-chip">caderno</span><span class="ad-chip">planilha</span>
    </div>
  </div>
  <div class="ad-half depois">
    <span class="ad-label">Depois</span>
    <div class="ad-one">Agenda, lembrete, videochamada e notas <span class="hl">num lugar só</span>.</div>
  </div>
  <div class="footer"><span>@handle</span><span></span></div>
</section>
