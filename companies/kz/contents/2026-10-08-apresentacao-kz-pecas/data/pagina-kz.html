.pg-kz .pg-prox { margin: 16px 0; border: 1px solid var(--border); border-radius: 16px; padding: 20px; background: radial-gradient(circle at 100% 0, var(--ui-glow), var(--surface) 55%); }

.pg-kz .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pg-kz .tile { border: 1px solid var(--border); border-radius: 18px; padding: 16px; height: 168px; display: flex; flex-direction: column; justify-content: space-between; font-size: 21px; font-weight: 600; color: var(--text); }
